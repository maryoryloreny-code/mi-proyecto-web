<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>camaWaze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f2f6;--surf:#fff;--ink:#12263a;--mut:#5b7083;--line:#cfdde6;--blue:#1b6fe0;--ok:#16a06a;--low:#d98e04;--full:#d03d3d;--okbg:#dff5ea;--lowbg:#fdf0d2;--fullbg:#fbe0e0;--map:#dcebf2;--road:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b27;--surf:#16293a;--ink:#e6eff6;--mut:#93a8b9;--line:#2a4358;--blue:#5ea2ff;--ok:#3ecb92;--low:#f0b73a;--full:#ff7676;--okbg:#14382c;--lowbg:#3b3015;--fullbg:#3d1d1f;--map:#12293a;--road:#1f3a50}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;line-height:1.15}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;max-width:1100px;margin:0 auto}
.logo{font:800 28px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}.logo span{color:var(--blue)}
.tag{color:var(--mut);font-size:14px;max-width:48ch}
nav{display:flex;gap:6px;background:var(--surf);padding:5px;border-radius:999px;border:1px solid var(--line)}
nav button{border:0;background:none;color:var(--ink);padding:8px 16px;border-radius:999px;font:600 15px Figtree,sans-serif;cursor:pointer}
nav button.on{background:var(--blue);color:#fff}
main{max-width:1100px;margin:0 auto;padding:0 20px 40px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;grid-template-columns:1.05fr 1fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
@media(max-width:600px){.filters{grid-template-columns:1fr}}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
select{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{border:0;background:var(--blue);color:#fff;padding:9px 14px;border-radius:9px;font:600 14px Figtree,sans-serif;cursor:pointer}
.btn.sec{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--full)}.btn.good{background:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.map{width:100%;height:auto;border-radius:12px;display:block;background:var(--map)}
.opt{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border:0}.opt.first{background:linear-gradient(90deg,var(--okbg),transparent);margin:0 -16px;padding:12px 16px}
.opt h3{font-size:17px}.meta{font-size:13px;color:var(--mut)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.low{background:var(--lowbg);color:var(--low)}.pill.full{background:var(--fullbg);color:var(--full)}.pill.nc{background:var(--line);color:var(--mut)}
.eta{font:800 26px 'Bricolage Grotesque',sans-serif;text-align:right;line-height:1}.eta small{font:400 12px Figtree;color:var(--mut);display:block}
.banner{border-radius:12px;padding:14px 16px;margin-bottom:16px;border:1px solid}
.banner.pendiente{background:var(--lowbg);border-color:var(--low)}.banner.aceptado{background:var(--okbg);border-color:var(--ok)}.banner.rechazado{background:var(--fullbg);border-color:var(--full)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.svc{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.step{display:flex;align-items:center;gap:8px}.step button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:600 18px Figtree;cursor:pointer}
.step b{min-width:70px;text-align:center}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi b{font:800 30px 'Bricolage Grotesque';display:block;line-height:1.1}.kpi span{font-size:13px;color:var(--mut)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600}
.note{font-size:13px;color:var(--mut);margin-top:20px}
.empty{color:var(--mut);padding:14px 0}
</style>
</head>
<body>
<header>
  <div><div class="logo">cama<span>Waze</span></div><div class="tag">Red en tiempo real de camas entre hospitales, ambulancias y EPS. Un solo destino confirmado, sin paseos.</div></div>
  <nav id="nav" aria-label="Rol"></nav>
</header>
<main id="app"></main>
<script>
const SV={urg:'Urgencias',hosp:'Hospitalización',uci:'UCI adulto',uciP:'UCI pediátrica',sala:'Salas de cirugía',obst:'Obstetricia'};
const TR={1:'Triage I – Reanimación',2:'Triage II – Emergencia',3:'Triage III – Urgencia',4:'Triage IV – Menos urgente',5:'Triage V – No urgente'};
const EPSL=['Sanitas','Sura','Nueva EPS','Compensar','Famisanar','Salud Total'];
const now=Date.now(),AMB={x:150,y:230};
const H=[
 {id:1,n:'Hospital Universitario Norte',x:330,y:60,eps:['Sanitas','Sura','Nueva EPS','Compensar'],b:{urg:[30,4],hosp:[120,15],uci:[20,0],uciP:[8,2],sala:[6,1],obst:[16,3]},t:now-240000},
 {id:2,n:'Clínica Santa Aurora',x:470,y:190,eps:['Sura','Compensar','Famisanar'],b:{urg:[18,0],hosp:[60,6],uci:[10,1],uciP:[0,0],sala:[4,2],obst:[10,0]},t:now-90000},
 {id:3,n:'Hospital Central de Occidente',x:90,y:110,eps:['Nueva EPS','Famisanar','Salud Total'],b:{urg:[40,9],hosp:[150,0],uci:[24,3],uciP:[10,0],sala:[8,3],obst:[20,5]},t:now-600000},
 {id:4,n:'Clínica del Sur',x:250,y:310,eps:['Sanitas','Salud Total','Nueva EPS'],b:{urg:[22,2],hosp:[80,11],uci:[12,0],uciP:[4,1],sala:[5,0],obst:[12,4]},t:now-30000},
 {id:5,n:'Hospital Regional Oriente',x:520,y:300,eps:['Sura','Sanitas','Nueva EPS','Famisanar'],b:{urg:[35,0],hosp:[110,2],uci:[16,0],uciP:[6,0],sala:[7,0],obst:[14,1]},t:now-420000}
];
let R=[
 {id:'CW-1041',hid:3,svc:'urg',tri:3,eps:'Salud Total',st:'aceptado',t:now-3600000,t2:now-3480000},
 {id:'CW-1042',hid:2,svc:'uci',tri:2,eps:'Sura',st:'rechazado',why:'Sin cama real en el servicio',t:now-2700000,t2:now-2640000},
 {id:'CW-1043',hid:1,svc:'uci',tri:2,eps:'Sura',st:'aceptado',t:now-2600000,t2:now-2500000}
];
let n=1044,ui={role:'amb',svc:'urg',tri:2,eps:'Sanitas',hid:1,cur:null};
const fmt=t=>new Date(t).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
const km=h=>Math.hypot(h.x-AMB.x,h.y-AMB.y)/30, eta=h=>Math.round(km(h)*2.6+3);
const cls=(f,t)=>f===0?'full':f/t<=.2?'low':'ok';
const lbl={ok:'Hay cupo',low:'Pocas camas',full:'Sin cupo'};
const hn=id=>H.find(h=>h.id===id).n;
function rank(){return H.map(h=>({h,f:h.b[ui.svc][1],tt:h.b[ui.svc][0],e:eta(h),c:h.eps.includes(ui.eps)})).sort((a,b)=>{
 if((a.f>0)!==(b.f>0))return a.f>0?-1:1;
 const k=x=>ui.tri<=2?x.e:(x.c?0:100)+x.e;return k(a)-k(b)})}
function ask(hid){const h=H.find(x=>x.id===hid),b=h.b[ui.svc];if(b[1]<1)return;b[1]--;h.t=Date.now();
 const r={id:'CW-'+(n++),hid,svc:ui.svc,tri:ui.tri,eps:ui.eps,st:'pendiente',t:Date.now()};R.unshift(r);ui.cur=r.id;draw()}
function reply(id,ok,why){const r=R.find(x=>x.id===id);r.st=ok?'aceptado':'rechazado';r.t2=Date.now();
 if(!ok){r.why=why;const h=H.find(x=>x.id===r.hid);h.b[r.svc][1]=Math.min(h.b[r.svc][0],h.b[r.svc][1]+1);h.t=Date.now()}draw()}
function adj(hid,k,d){const h=H.find(x=>x.id===hid),b=h.b[k];b[1]=Math.max(0,Math.min(b[0],b[1]+d));h.t=Date.now();draw()}
function set(k,v){ui[k]=(k==='tri'||k==='hid')?+v:v;if(k==='svc'||k==='tri'||k==='eps')ui.cur=null;draw()}
function sel(k,opts,val){return `<select onchange="set('${k}',this.value)">${opts.map(([v,t])=>`<option value="${v}" ${v==val?'selected':''}>${t}</option>`).join('')}</select>`}

function amb(){
 const rk=rank(),top=rk[0],cur=R.find(r=>r.id===ui.cur);
 let ban='';
 if(cur){const m={pendiente:`Esperando confirmación de <b>${hn(cur.hid)}</b>. Cama retenida, siga en ruta.`,aceptado:`<b>${hn(cur.hid)}</b> confirmó el ingreso (${SV[cur.svc]}). Destino único: no hay más paradas.`,rechazado:`<b>${hn(cur.hid)}</b> rechazó: ${cur.why}. El rechazo quedó registrado para la EPS; elija el siguiente destino.`};
  ban=`<div class="banner ${cur.st}"><div class="row"><b>${cur.id}</b><span>${m[cur.st]}</span></div></div>`}
 const lock=cur&&cur.st!=='rechazado';
 const pins=H.map(h=>{const f=h.b[ui.svc][1],c=cls(f,h.b[ui.svc][0]);return `<g><circle cx="${h.x}" cy="${h.y}" r="17" fill="var(--${c})"/><text x="${h.x}" y="${h.y+5}" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">${f}</text><text x="${h.x}" y="${h.y+34}" text-anchor="middle" font-size="11" fill="var(--ink)">${h.n.split(' ').slice(-2).join(' ')}</text></g>`}).join('');
 const map=`<svg class="map" viewBox="0 0 600 360" role="img" aria-label="Mapa de hospitales cercanos"><path d="M0 250H600M0 120H600M200 0V360M400 0V360M0 330L600 40" stroke="var(--road)" stroke-width="9" fill="none"/>${top.f>0?`<line x1="${AMB.x}" y1="${AMB.y}" x2="${top.h.x}" y2="${top.h.y}" stroke="var(--blue)" stroke-width="4" stroke-dasharray="9 7"/>`:''}${pins}<g transform="translate(${AMB.x} ${AMB.y})"><rect x="-22" y="-13" width="44" height="26" rx="7" fill="var(--blue)"/><path d="M-3-8h6v5h5v6h-5v5h-6v-5h-5v-6h5z" fill="#fff"/></g></svg><div class="meta" style="margin-top:6px">El número en cada punto son las camas libres de ${SV[ui.svc].toLowerCase()}.</div>`;
 const list=rk.map((x,i)=>{const c=cls(x.f,x.tt),first=i===0&&x.f>0;
  return `<div class="opt ${first?'first':''}"><div><h3>${first?'Recomendado: ':''}${x.h.n}</h3><div class="row" style="margin-top:4px"><span class="pill ${c}">${lbl[c]} · ${x.f}/${x.tt}</span><span class="pill ${x.c?'ok':'nc'}">${x.c?'Contrato con '+ui.eps:'Sin contrato con '+ui.eps}</span></div><div class="meta">${km(x.h).toFixed(1)} km · actualizado ${fmt(x.h.t)}${!x.c&&ui.tri<=2?' · urgencia vital: la atención inicial es obligatoria':''}</div></div><div><div class="eta">${eta(x.h)}<small>min</small></div></div><div><button class="btn" ${x.f<1||lock?'disabled':''} onclick="ask(${x.h.id})">Solicitar cama</button></div></div>`}).join('');
 return `<div class="card filters" style="margin-bottom:16px"><div><label>Servicio que necesita el paciente</label>${sel('svc',Object.entries(SV),ui.svc)}</div><div><label>Clasificación de triage</label>${sel('tri',Object.entries(TR),ui.tri)}</div><div><label>EPS del paciente</label>${sel('eps',EPSL.map(e=>[e,e]),ui.eps)}</div></div>${ban}<div class="grid"><div class="card">${map}</div><div class="card"><h2 style="margin-bottom:4px">Destinos disponibles</h2><div class="meta">${ui.tri<=2?'Triage crítico: se ordena por tiempo de llegada.':'Se prioriza hospital con contrato y luego cercanía.'}</div>${list}</div></div>`}

function hosp(){
 const h=H.find(x=>x.id===ui.hid),inc=R.filter(r=>r.hid===h.id&&r.st==='pendiente');
 const incs=inc.length?inc.map(r=>`<div class="banner pendiente"><div><b>${r.id}</b> · ${SV[r.svc]} · ${TR[r.tri]} · ${r.eps} · solicitado ${fmt(r.t)}</div><div class="row" style="margin-top:8px"><button class="btn good" onclick="reply('${r.id}',true)">Aceptar ingreso</button><select style="width:auto" id="w${r.id}"><option>Sin cama real en el servicio</option><option>Falta especialista o equipo</option><option>Paciente requiere otro nivel de complejidad</option></select><button class="btn bad" onclick="reply('${r.id}',false,document.getElementById('w${r.id}').value)">Rechazar con motivo</button></div></div>`).join(''):`<div class="empty">No hay ambulancias en camino con solicitud pendiente.</div>`;
 const rows=Object.entries(SV).map(([k,v])=>{const [t,f]=h.b[k],c=cls(f,t);return `<div class="svc"><div><b>${v}</b> <span class="pill ${c}">${lbl[c]}</span><div class="bar"><i style="width:${t?(t-f)/t*100:0}%;background:var(--${c})"></i></div><div class="meta">${t-f} ocupadas de ${t}</div></div><div class="step"><button aria-label="Ocupar una cama" onclick="adj(${h.id},'${k}',-1)">−</button><b>${f} libres</b><button aria-label="Liberar una cama" onclick="adj(${h.id},'${k}',1)">+</button></div></div>`}).join('');
 return `<div class="card filters" style="grid-template-columns:1fr"><div><label>Institución que reporta</label>${sel('hid',H.map(x=>[x.id,x.n]),ui.hid)}</div></div><div class="grid"><div class="card"><h2>Disponibilidad en vivo</h2><div class="meta">Cada cambio se publica a ambulancias y EPS al instante. Último reporte ${fmt(h.t)}.</div>${rows}</div><div class="card"><h2 style="margin-bottom:10px">Ambulancias en camino</h2>${incs}<div class="meta">Al rechazar debe indicar motivo. Queda en el registro que ve la EPS.</div></div></div>`}

function eps(){
 const tot=R.length,ac=R.filter(r=>r.st==='aceptado').length,re=R.filter(r=>r.st==='rechazado').length,pe=R.filter(r=>r.st==='pendiente').length;
 const tr=H.map(h=>{const t=Object.values(h.b).reduce((a,b)=>a+b[0],0),f=Object.values(h.b).reduce((a,b)=>a+b[1],0),o=Math.round((t-f)/t*100);const c=o>=95?'full':o>=80?'low':'ok';return `<tr><td>${h.n}</td><td>${h.eps.join(', ')}</td><td><b>${o}%</b><div class="bar"><i style="width:${o}%;background:var(--${c})"></i></div></td><td>${h.b.uci[1]}</td><td>${h.b.urg[1]}</td><td>${fmt(h.t)}</td></tr>`}).join('');
 const lg=R.map(r=>`<tr><td>${r.id}</td><td>${hn(r.hid)}</td><td>${SV[r.svc]}</td><td>${r.eps}</td><td><span class="pill ${r.st==='aceptado'?'ok':r.st==='rechazado'?'full':'low'}">${r.st}</span></td><td>${r.t2?Math.max(1,Math.round((r.t2-r.t)/60000))+' min':'—'}</td><td>${r.why||''}</td></tr>`).join('');
 return `<div class="kpis"><div class="card kpi"><b>${tot}</b><span>Traslados solicitados</span></div><div class="card kpi"><b style="color:var(--ok)">${ac}</b><span>Ingresos confirmados</span></div><div class="card kpi"><b style="color:var(--full)">${re}</b><span>Rechazos (con motivo)</span></div><div class="card kpi"><b style="color:var(--low)">${pe}</b><span>Pendientes</span></div></div>
 <div class="card" style="margin-bottom:16px"><h2 style="margin-bottom:8px">Ocupación de la red</h2><div class="scroll"><table><tr><th>Institución</th><th>Contrato con</th><th>Ocupación total</th><th>UCI libres</th><th>Urgencias libres</th><th>Reporte</th></tr>${tr}</table></div></div>
 <div class="card"><h2 style="margin-bottom:8px">Trazabilidad de cada traslado</h2><div class="scroll"><table><tr><th>Código</th><th>Hospital</th><th>Servicio</th><th>EPS</th><th>Estado</th><th>Respuesta</th><th>Motivo</th></tr>${lg}</table></div></div>`}

function draw(){
 const roles=[['amb','Ambulancia'],['hosp','Hospital'],['eps','EPS y CRUE']];
 document.getElementById('nav').innerHTML=roles.map(([k,v])=>`<button class="${ui.role===k?'on':''}" onclick="ui.role='${k}';draw()">${v}</button>`).join('');
 document.getElementById('app').innerHTML={amb,hosp,eps}[ui.role]()+`<p class="note">Prototipo de innovación con datos ficticios. Para producción: estándar HL7 FHIR, protección de datos de salud (Ley 1581), GPS real de ambulancias e integración con el CRUE y el reporte de capacidad de cada IPS.</p>`}
draw();
</script>
</body>
</html>
